<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Tesla OAuth callback</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      background: #111;
      color: #f5f5f5;
      line-height: 1.4;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    p {
      max-width: 40rem;
      color: #ccc;
    }
    label {
      display: block;
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #bbb;
    }
    pre {
      font-size: 1.35rem;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: all;
      background: #1c1c1c;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin: 0.35rem 0 0;
    }
  </style>
</head>
<body>
  <h1>Tesla OAuth redirect</h1>
  <p>This page only shows the address and query parameters already in your browser. Nothing is sent anywhere.</p>
  <label for="url">Full URL</label>
  <pre id="url"></pre>
  <label for="code">code</label>
  <pre id="code"></pre>
  <label for="state">state</label>
  <pre id="state"></pre>
  <label for="error">error</label>
  <pre id="error"></pre>
  <label for="error_description">error_description</label>
  <pre id="error_description"></pre>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      function show(id, value) {
        document.getElementById(id).textContent =
          value == null || value === "" ? "(not present)" : value;
      }
      document.getElementById("url").textContent = window.location.href;
      show("code", params.get("code"));
      show("state", params.get("state"));
      show("error", params.get("error"));
      show("error_description", params.get("error_description"));
    })();
  </script>
</body>
</html>
