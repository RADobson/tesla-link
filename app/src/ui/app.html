<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>White Lotus</title>
  <style>__FONT_CSS__</style>
  <style>
    :root {
      --wash: #0b100e;
      --pond: #121916;
      --sheet: rgba(232, 226, 214, 0.045);
      --ink: #e7efe8;
      --muted: #a7b4ab;
      --line: rgba(212, 184, 140, 0.28);
      --gold: #e4d2b0;
      --gold-deep: #c4a46a;
      --jade: #8fbfa8;
      --water: #7ea8b0;
      --blossom: #e7b7b0;
      --danger: #e0a090;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Lotus Sans", "Avenir Next", system-ui, sans-serif;
      font-weight: 400;
      background:
        radial-gradient(900px 480px at 80% -10%, rgba(212, 180, 131, 0.14), transparent 55%),
        radial-gradient(700px 500px at -10% 20%, rgba(80, 120, 110, 0.18), transparent 50%),
        var(--wash);
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.18;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .skip {
      position: absolute;
      left: 12px;
      top: -40px;
      background: var(--gold);
      color: #1a140c;
      padding: 8px 12px;
      z-index: 5;
    }
    .skip:focus { top: 12px; }
    header, main { position: relative; width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; padding: 36px 0 8px; gap: 16px; }
    .brand { display: flex; gap: 14px; align-items: center; text-decoration: none; }
    .brand svg { width: 42px; height: 42px; }
    .brand strong { display: block; font-family: "Lotus Serif", Georgia, serif; font-weight: 500; font-size: 1.7rem; letter-spacing: 0.01em; }
    .brand span, .kicker { color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.72rem; }
    nav a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px; }
    nav a:hover { color: var(--gold); border-color: var(--gold-deep); }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 18px 0 80px; }
    .span2 { grid-column: span 2; }
    .card, .sheet {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 26px 26px 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    h1, h2, .num {
      font-family: "Lotus Serif", Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    h1 { font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 0.95; margin: 8px 0 0; }
    h2 { font-size: 1.7rem; margin: 6px 0 8px; }
    .num { font-size: clamp(3.2rem, 7vw, 5.4rem); line-height: 0.9; margin: 8px 0 0; }
    .num em { font-style: italic; color: var(--gold); font-size: 0.42em; margin-left: 8px; }
    p { line-height: 1.55; }
    .muted { color: var(--muted); }
    .figure-row, .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 22px; }
    .figure { border-top: 1px solid var(--line); padding-top: 10px; }
    .figure b { display: block; font-family: "Lotus Serif", Georgia, serif; font-size: 1.65rem; font-weight: 500; }
    .figure span { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
    svg.viz { width: 100%; height: auto; display: block; }
    .flow path.stream { fill: none; stroke-linecap: round; stroke-dasharray: 7 11; animation: drift 4.5s linear infinite; }
    @keyframes drift { to { stroke-dashoffset: -72; } }
    @keyframes ripple { from { transform: scale(0.86); opacity: 0.55; } to { transform: scale(1.08); opacity: 0.15; } }
    .ripples ellipse { transform-origin: center; animation: ripple 5.5s ease-in-out infinite; }
    .ripples ellipse:nth-child(2) { animation-delay: 1.2s; }
    .ripples ellipse:nth-child(3) { animation-delay: 2.4s; }
    .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 14px; }
    .cell {
      aspect-ratio: 1;
      border-radius: 10px;
      background: color-mix(in srgb, var(--jade) calc(var(--self, 0) * 100%), #1a2420);
      border: 1px solid rgba(232, 226, 214, 0.08);
    }
    .cell span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .session { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 10px; align-items: center; margin: 10px 0; font-size: 0.85rem; }
    .track { height: 8px; border-radius: 99px; background: #24302b; overflow: hidden; display: flex; }
    .track i { display: block; height: 100%; }
    .track .sun { background: var(--gold-deep); }
    .track .grid { background: var(--water); }
    button, summary { font: inherit; color: var(--ink); }
    button, .btn {
      min-height: 44px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 16px;
      cursor: pointer;
    }
    button.primary { background: var(--gold); color: #1c160e; border-color: transparent; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.45; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    label.slider, label.field { display: block; margin: 14px 0; }
    label.slider span, label.field span { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; }
    input[type="range"] { width: 100%; accent-color: #c4a46a; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; margin-top: 6px; background: #0d1210; color: var(--ink);
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit;
    }
    .stepper { display: flex; gap: 8px; margin: 14px 0 16px; }
    .stepper b { flex: 1; border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); font-weight: 400; font-size: 0.75rem; }
    .stepper b.on { border-color: var(--gold-deep); color: var(--gold); }
    .exact { font-family: "Lotus Serif", Georgia, serif; font-size: 1.8rem; margin: 8px 0; }
    .banner { background: var(--gold); color: #1c160e; border-radius: 16px; padding: 12px 14px; }
    dialog { border: 1px solid var(--line); background: #17201c; color: var(--ink); border-radius: 22px; padding: 22px; width: min(420px, calc(100% - 32px)); }
    dialog::backdrop { background: rgba(0,0,0,0.6); }
    dialog p { color: var(--muted); }
    .error { color: var(--danger); min-height: 1.2em; }
    .stage { min-height: calc(100vh - 120px); display: grid; place-items: center; padding: 24px 0 64px; }
    .login { width: min(440px, 100%); }
    .login h1 { font-size: 2.6rem; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 12px; }
    @media (max-width: 800px) {
      header, main { width: min(100% - 28px, 1080px); }
      header { flex-direction: column; align-items: flex-start; }
      .board { grid-template-columns: 1fr; }
      .span2 { grid-column: auto; }
      .figure-row, .stats { grid-template-columns: 1fr 1fr; }
      .session { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body data-page="__PAGE__">
  <a class="skip" href="#app">Skip to content</a>
  <header>
    <a class="brand" href="/">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#c4a46a" stroke-width="1"/>
        <path d="M32 14c6 8 6 13 0 18-6-5-6-10 0-18z" fill="none" stroke="#e7efe8" stroke-width="1.2"/>
        <path d="M32 32c8 3 13 7 14 13-9-1-12-5-14-13z" fill="none" stroke="#8fbfa8" stroke-width="1.2"/>
        <path d="M32 32c-8 3-13 7-14 13 9-1 12-5 14-13z" fill="none" stroke="#8fbfa8" stroke-width="1.2"/>
      </svg>
      <div><span>Moonlit pond</span><strong>White Lotus</strong></div>
    </a>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <dialog id="confirm">
    <h2 id="confirm-title"></h2>
    <p id="confirm-detail"></p>
    <div class="row"><button type="button" id="confirm-no">Cancel</button><button type="button" class="primary" id="confirm-yes">Send command</button></div>
  </dialog>
  <script type="application/json" id="boot">__BOOT_JSON__</script>
  <script nonce="__NONCE__">
    const page = document.body.dataset.page;
    const boot = JSON.parse(document.getElementById("boot").textContent || "null");
    const app = document.getElementById("app");
    const nav = document.getElementById("nav");
    nav.innerHTML = page === "public" || page === "login" ? '<a href="/login">Owner</a>' : '<a href="/">The pond</a>';

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function kw(watts) { return (Number(watts || 0) / 1000).toFixed(1); }
    function money(value, currency) {
      try { return new Intl.NumberFormat("en-AU", { style: "currency", currency: currency || "AUD" }).format(value || 0); }
      catch { return "$" + Number(value || 0).toFixed(2); }
    }
    function hourIn(ts, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: timeZone || "Australia/Sydney", hour: "2-digit", hourCycle: "h23" }).formatToParts(new Date(ts));
      const hour = Number(parts.find((part) => part.type === "hour")?.value || 0);
      return hour === 24 ? 0 : hour;
    }
    function ask(title, detail) {
      const dialog = document.getElementById("confirm");
      document.getElementById("confirm-title").textContent = title;
      document.getElementById("confirm-detail").textContent = detail;
      dialog.showModal();
      return new Promise((resolve) => {
        const yes = document.getElementById("confirm-yes");
        const no = document.getElementById("confirm-no");
        const finish = (value) => { yes.onclick = null; no.onclick = null; dialog.close(); resolve(value); };
        yes.onclick = () => finish(true);
        no.onclick = () => finish(false);
      });
    }

    function stroke(watts) { return (0.7 + Math.min(6.5, Math.abs(Number(watts) || 0) / 1000 * 1.5)).toFixed(2); }

    function flowSvg(energy, vehicle) {
      const e = energy || {};
      const carW = e.chargerW || (vehicle && vehicle.chargingState === "Charging" ? 3000 : 200);
      const nodes = [
        ["Sun", kw(e.solarW), 70, 54],
        ["House", kw(e.homeW), 250, 54],
        ["Car", vehicle && vehicle.batteryPercent != null ? Math.round(vehicle.batteryPercent) + "%" : "—", 430, 54],
        ["Battery", e.batterySoc == null ? "—" : Math.round(e.batterySoc) + "%", 160, 176],
        ["Grid", kw(Math.abs(e.gridW || 0)), 340, 176],
      ];
      const links = [
        [70, 54, 250, 54, e.solarW, "#e4d2b0"],
        [250, 78, 160, 160, Math.abs(e.batteryW || 0), "#8fbfa8"],
        [250, 78, 340, 160, Math.abs(e.gridW || 0), "#7ea8b0"],
        [280, 54, 400, 54, carW, "#e7b7b0"],
      ];
      const paths = links.map(([x1, y1, x2, y2, watts, color], index) => {
        const bow = index % 2 === 0 ? -36 : 36;
        const c1x = x1 + (x2 - x1) * 0.35;
        const c2x = x1 + (x2 - x1) * 0.65;
        return `<path class="stream" d="M${x1} ${y1} C ${c1x} ${y1 + bow}, ${c2x} ${y2 + bow}, ${x2} ${y2}" stroke="${color}" stroke-width="${stroke(watts)}" />`;
      }).join("");
      const labels = nodes.map(([name, value, x, y]) =>
        `<g><circle cx="${x}" cy="${y}" r="22" fill="#121916" stroke="#c4a46a" stroke-width="0.8"/><text x="${x}" y="${y + 4}" text-anchor="middle" fill="#e7efe8" font-size="11" font-family="Lotus Serif, Georgia, serif">${esc(value)}</text><text x="${x}" y="${y + 38}" text-anchor="middle" fill="#a7b4ab" font-size="10" font-family="Lotus Sans, sans-serif">${esc(name)}</text></g>`
      ).join("");
      return `<svg class="viz" viewBox="0 0 500 230" role="img" aria-label="Energy flowing between the sun, house, battery, grid and car">
        ${paths}${labels}
      </svg>`;
    }

    function lotusSvg(soc) {
      const open = soc == null ? 0.35 : 0.3 + (Number(soc) / 100) * 0.7;
      let petals = "";
      for (let i = 0; i < 8; i++) {
        petals += `<ellipse cx="90" cy="62" rx="${16 * open}" ry="${36 * open}" transform="rotate(${i * 45} 90 96)" fill="none" stroke="${i % 2 ? "#8fbfa8" : "#e4d2b0"}" stroke-width="1.15"/>`;
      }
      const label = soc == null ? "No reading" : Math.round(soc) + " percent";
      return `<svg class="viz" viewBox="0 0 180 190" role="img" aria-label="Home battery, drawn as a lotus ${esc(label)} open">
        ${petals}
        <circle cx="90" cy="96" r="${10 + open * 8}" fill="none" stroke="#e7efe8" stroke-width="1"/>
        <text x="90" y="168" text-anchor="middle" fill="#e4d2b0" font-family="Lotus Serif, Georgia, serif" font-size="22">${soc == null ? "—" : Math.round(soc) + "%"}</text>
      </svg>`;
    }

    function sunSvg(history, timeZone) {
      const byHour = {};
      for (const point of history || []) {
        const hour = hourIn(point.ts, timeZone);
        byHour[hour] = Math.max(byHour[hour] || 0, point.solarW || 0);
      }
      const max = Math.max(400, ...Object.values(byHour), 0);
      const cx = 180, cy = 168, r = 130;
      let marks = "";
      for (let hour = 6; hour <= 18; hour++) {
        const t = (hour - 6) / 12;
        const angle = Math.PI * (1 - t);
        const solar = byHour[hour] || 0;
        const len = 8 + (solar / max) * 36;
        const x1 = cx + (r - len) * Math.cos(angle);
        const y1 = cy - (r - len) * Math.sin(angle);
        const x2 = cx + r * Math.cos(angle);
        const y2 = cy - r * Math.sin(angle);
        marks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#e4d2b0" stroke-width="${solar > 0 ? 2.2 : 0.6}" stroke-linecap="round"/>`;
      }
      const nowHour = hourIn(Date.now(), timeZone);
      const sunT = Math.min(1, Math.max(0, (nowHour - 6) / 12));
      const sunA = Math.PI * (1 - sunT);
      const sx = cx + (r + 16) * Math.cos(sunA);
      const sy = cy - (r + 16) * Math.sin(sunA);
      return `<svg class="viz" viewBox="0 0 360 200" role="img" aria-label="Today's solar curve along the sun's arc">
        <path d="M${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="rgba(212,180,131,0.35)" stroke-width="1"/>
        ${marks}
        <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="7" fill="#e4d2b0"/>
        <text x="40" y="188" fill="#a7b4ab" font-size="11" font-family="Lotus Sans, sans-serif">dawn</text>
        <text x="286" y="188" fill="#a7b4ab" font-size="11" font-family="Lotus Sans, sans-serif">dusk</text>
      </svg>`;
    }

    function gardenSvg(score) {
      const km = Number(score?.kmDriven || 0);
      const share = Math.round((score?.solarShare || 0) * 100);
      const rings = Math.max(1, Math.min(8, Math.round(km / 22) || 1));
      let sand = "";
      for (let i = 1; i <= rings; i++) {
        sand += `<ellipse cx="180" cy="108" rx="${22 + i * 18}" ry="${10 + i * 8}" fill="none" stroke="rgba(228,210,176,${(0.18 + i / 18).toFixed(2)})" stroke-width="1"/>`;
      }
      return `<svg class="viz" viewBox="0 0 360 200" role="img" aria-label="${esc(km)} kilometres this week, ${share} percent of charging from solar, drawn as raked sand">
        ${sand}
        <circle cx="180" cy="108" r="16" fill="#121916" stroke="#e4d2b0"/>
        <text x="180" y="112" text-anchor="middle" fill="#e4d2b0" font-size="11" font-family="Lotus Serif, Georgia, serif">${share}%</text>
      </svg>
      <p class="muted">${esc(km)} km on the odometer this week. ${esc(Number(score?.solarKwh || 0).toFixed(1))} kWh of the car's charge came from the roof, ${esc(Number(score?.gridKwh || 0).toFixed(1))} kWh from the grid. About ${esc(money(score?.dollarsSaved, score?.currency))} not bought.</p>`;
    }

    function heatHtml(days) {
      const cells = (days && days.length) ? days.slice(-21) : [];
      if (!cells.length) return `<p class="muted">No days in the ledger yet.</p>`;
      return `<div class="heat">${cells.map((day) => `<div class="cell" style="--self:${Number(day.self).toFixed(2)}" role="img" aria-label="${esc(day.label)}, ${Math.round(day.self * 100)} percent of the house covered by the roof"><span>${esc(day.label)}</span></div>`).join("")}</div>
        <p class="muted">Each square is a day. Jade means the roof covered more of the house.</p>`;
    }

    function sessionsHtml(sessions) {
      const rows = sessions || [];
      if (!rows.length) return `<p class="muted">No charge recorded in this ledger.</p>`;
      const max = Math.max(...rows.map((row) => row.solarKwh + row.gridKwh), 0.1);
      return rows.slice(-6).map((row) => {
        const total = row.solarKwh + row.gridKwh;
        const sun = Math.round((row.solarKwh / max) * 100);
        const grid = Math.round((row.gridKwh / max) * 100);
        const start = new Date(row.start);
        const label = start.toLocaleString("en-AU", { weekday: "short", hour: "numeric", minute: "2-digit" });
        return `<div class="session"><span>${esc(label)}</span><div class="track" role="img" aria-label="${esc(row.solarKwh.toFixed(1))} kilowatt hours solar and ${esc(row.gridKwh.toFixed(1))} from the grid"><i class="sun" style="width:${sun}%"></i><i class="grid" style="width:${grid}%"></i></div><span>${esc(total.toFixed(1))} kWh</span></div>`;
      }).join("");
    }

    function balanceSvg(history) {
      let imported = 0, exported = 0;
      const points = history || [];
      for (let i = 1; i < points.length; i++) {
        const hours = (points[i].ts - points[i - 1].ts) / 3_600_000;
        if (hours <= 0 || hours > 1) continue;
        const watts = points[i].gridW || 0;
        if (watts >= 0) imported += watts * hours;
        else exported += -watts * hours;
      }
      const total = imported + exported || 1;
      const tilt = Math.max(-12, Math.min(12, ((imported - exported) / total) * 16));
      return `<svg class="viz" viewBox="0 0 360 160" role="img" aria-label="Grid balance, ${esc((exported / 1000).toFixed(1))} kilowatt hours exported and ${esc((imported / 1000).toFixed(1))} imported over the recent samples">
        <g transform="rotate(${tilt.toFixed(1)} 180 78)">
          <line x1="50" y1="78" x2="310" y2="78" stroke="#e4d2b0" stroke-width="1.4"/>
          <circle cx="78" cy="78" r="${(10 + (exported / total) * 18).toFixed(1)}" fill="none" stroke="#8fbfa8" stroke-width="1.4"/>
          <circle cx="282" cy="78" r="${(10 + (imported / total) * 18).toFixed(1)}" fill="none" stroke="#7ea8b0" stroke-width="1.4"/>
        </g>
        <line x1="180" y1="78" x2="180" y2="118" stroke="#a7b4ab" stroke-width="1"/>
        <text x="78" y="28" text-anchor="middle" fill="#8fbfa8" font-size="12" font-family="Lotus Sans, sans-serif">out ${(exported / 1000).toFixed(1)}</text>
        <text x="282" y="28" text-anchor="middle" fill="#7ea8b0" font-size="12" font-family="Lotus Sans, sans-serif">in ${(imported / 1000).toFixed(1)}</text>
      </svg>`;
    }

    function blossomSvg(solarKwh) {
      const kg = Number(solarKwh || 0) * 0.68;
      const count = Math.max(0, Math.min(9, Math.round(kg / 6)));
      let flowers = "";
      for (let i = 0; i < count; i++) {
        const x = 36 + (i % 5) * 28;
        const y = 78 - Math.floor(i / 5) * 26 - (i % 2) * 8;
        flowers += `<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="#e7b7b0" stroke-width="1.2"/>`;
      }
      return `<svg class="viz" viewBox="0 0 220 120" role="img" aria-label="About ${esc(kg.toFixed(0))} kilograms of grid carbon avoided, shown as ${count} blossoms">
        <path d="M20 100 C 60 90, 90 70, 190 46" fill="none" stroke="#8fbfa8" stroke-width="1.2"/>
        ${flowers}
      </svg>
      <p class="muted">About ${esc(kg.toFixed(0))} kg, counting 0.68 kg per solar kilowatt-hour. A sketch, not an audit.</p>`;
    }

    function koiSvg(percent, km) {
      const t = percent == null ? 0.15 : Math.min(1, Math.max(0, percent / 100));
      const x = 28 + t * 250;
      const y = 78 - Math.sin(t * Math.PI) * 36;
      return `<svg class="viz" viewBox="0 0 320 130" role="img" aria-label="A koi at ${percent == null ? "an unknown" : Math.round(percent)} percent charge, after ${esc(km)} kilometres this week">
        <path d="M20 90 C 80 90, 120 30, 300 50" fill="none" stroke="rgba(126,168,176,0.7)" stroke-width="1"/>
        <g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
          <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#e7b7b0" stroke-width="1.3"/>
          <path d="M14 0 L24 -6 L22 0 L24 6 Z" fill="none" stroke="#e7b7b0" stroke-width="1"/>
        </g>
      </svg>
      <p class="muted">${percent == null ? "The car has not reported a charge." : Math.round(percent) + "% full."} ${esc(km)} km on the week.</p>`;
    }

    function mapHtml() {
      return `<svg class="viz ripples" viewBox="0 0 640 220" role="img" aria-label="A coarse area about 20 kilometres across. The house is not shown.">
        <rect width="640" height="220" fill="#101614"/>
        <g stroke="rgba(228,210,176,0.15)" stroke-width="0.6">
          ${Array.from({ length: 8 }, (_, i) => `<line x1="${40 + i * 80}" y1="16" x2="${40 + i * 80}" y2="204"/>`).join("")}
          ${Array.from({ length: 4 }, (_, i) => `<line x1="20" y1="${36 + i * 48}" x2="620" y2="${36 + i * 48}"/>`).join("")}
        </g>
        <g>
          <ellipse cx="320" cy="112" rx="150" ry="62" fill="none" stroke="#c4a46a" stroke-width="1"/>
          <ellipse cx="320" cy="112" rx="108" ry="44" fill="rgba(196,164,106,0.08)" stroke="#8fbfa8" stroke-width="0.8"/>
          <ellipse cx="320" cy="112" rx="62" ry="24" fill="rgba(228,210,176,0.12)" stroke="#e4d2b0" stroke-width="0.6"/>
        </g>
      </svg>
      <p class="muted">About 20 km across. The house is not drawn. Trips from the last day stay off this pond.</p>`;
    }

    function dashboard(data) {
      const e = data.energy || {};
      const v = data.vehicle || {};
      const sunny = (e.solarW || 0) > 200;
      const gridLabel = Math.abs(e.gridW || 0) < 50 ? "Grid quiet" : ((e.gridW || 0) < 0 ? "Leaving" : "Arriving");
      const batteryLabel = (e.batteryW || 0) >= 0 ? "Taking" : "Giving";
      return `<div class="board">
        <section class="card span2">
          <p class="kicker">${esc(data.vehicleName || "White Lotus")} · ${data.stale ? "the last note is old" : "live"}</p>
          <h1>${sunny ? "The roof is giving" : "The roof is quiet"}</h1>
          <p class="num">${sunny ? kw(e.solarW) : (v.batteryPercent == null ? "—" : Math.round(v.batteryPercent))}<em>${sunny ? "kW" : "% in the car"}</em></p>
          <div class="figure-row">
            <div class="figure"><b>${kw(e.homeW)}</b><span>House kW</span></div>
            <div class="figure"><b>${e.batterySoc == null ? "—" : Math.round(e.batterySoc) + "%"}</b><span>Battery ${batteryLabel.toLowerCase()}</span></div>
            <div class="figure"><b>${kw(Math.abs(e.gridW || 0))}</b><span>${gridLabel}</span></div>
            <div class="figure"><b>${esc(v.chargingState || (v.online ? "Online" : "Asleep"))}</b><span>Car</span></div>
          </div>
        </section>
        <section class="card span2">
          <p class="kicker">Ink flow</p>
          <h2>Where the watts travel</h2>
          ${flowSvg(e, v)}
        </section>
        <section class="card">
          <p class="kicker">Home battery</p>
          <h2>The lotus</h2>
          ${lotusSvg(e.batterySoc)}
          <p class="muted">Petals open as the house battery fills.</p>
        </section>
        <section class="card">
          <p class="kicker">Today</p>
          <h2>Sun arc</h2>
          ${sunSvg(data.history, data.timeZone)}
        </section>
        <section class="card span2">
          <p class="kicker">This week</p>
          <h2>Raked garden</h2>
          ${gardenSvg(data.score)}
        </section>
        <section class="card">
          <p class="kicker">Days</p>
          <h2>Self-sufficiency</h2>
          ${heatHtml(data.days)}
        </section>
        <section class="card">
          <p class="kicker">The car</p>
          <h2>Charge sessions</h2>
          ${sessionsHtml(data.sessions)}
        </section>
        <section class="card">
          <p class="kicker">The grid</p>
          <h2>Balance</h2>
          ${balanceSvg(data.history)}
        </section>
        <section class="card">
          <p class="kicker">What was not burned</p>
          <h2>Blossoms</h2>
          ${blossomSvg(data.score && data.score.solarKwh)}
        </section>
        <section class="card">
          <p class="kicker">White Lotus</p>
          <h2>The koi</h2>
          ${koiSvg(v.batteryPercent, data.score ? data.score.kmDriven : 0)}
        </section>
        <section class="card span2">
          <p class="kicker">Place</p>
          <h2>A wide circle</h2>
          ${mapHtml()}
        </section>
      </div>`;
    }

    async function showPublic() {
      app.innerHTML = "<p class='kicker'>The pond is settling…</p>";
      try {
        const response = await fetch("/api/public/dashboard");
        if (!response.ok) throw new Error("The house did not answer");
        app.innerHTML = dashboard(await response.json());
      } catch (error) {
        app.innerHTML = `<section class="card"><h1>The pond is still</h1><p class="muted">${esc(error.message || "Nothing to show yet.")}</p></section>`;
      }
    }

    async function showLogin() {
      const status = await fetch("/api/auth/status").then((r) => r.json()).catch(() => ({ passkeys: 0 }));
      const register = status.passkeys === 0;
      app.innerHTML = `<div class="stage"><section class="card login">
        <p class="kicker">Owner</p>
        <h1>${register ? "A first key" : "Enter quietly"}</h1>
        <p class="muted">${register ? "One passkey, then the door locks. A setup code is required when one has been set." : "Only the owner's passkey opens the command desk."}</p>
        ${register ? '<label class="field"><span>Setup code</span><input id="setup" type="password" autocomplete="off"></label>' : ""}
        <p class="error" id="err"></p>
        <button class="primary" id="go" type="button">${register ? "Create passkey" : "Use passkey"}</button>
      </section></div>`;
      document.getElementById("go").onclick = async () => {
        const err = document.getElementById("err");
        err.textContent = "";
        try {
          const setupCode = document.getElementById("setup")?.value || "";
          const kind = register ? "register" : "login";
          const start = await fetch(`/api/auth/${kind}/options`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(register ? { setupCode } : {}) });
          const started = await start.json();
          if (!start.ok) throw new Error(started.error || "Could not start");
          const publicKey = register
            ? PublicKeyCredential.parseCreationOptionsFromJSON(started.options)
            : PublicKeyCredential.parseRequestOptionsFromJSON(started.options);
          const credential = register
            ? await navigator.credentials.create({ publicKey })
            : await navigator.credentials.get({ publicKey });
          const done = await fetch(`/api/auth/${kind}/verify`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ challengeId: started.challengeId, credential: credential.toJSON(), setupCode }) });
          const result = await done.json();
          if (!done.ok) throw new Error(result.error || "Passkey was not accepted");
          location.href = "/controls";
        } catch (error) {
          err.textContent = error.message || "Passkey failed";
        }
      };
    }

    function controlDesk(model, preview) {
      const data = model.dashboard || { energy: {}, vehicle: {} };
      const settings = model.settings || { chargeLimit: 80, amps: 32, chargeSoc: 80 };
      const e = data.energy || {};
      app.innerHTML = `<div class="board controls">
        ${preview ? '<p class="banner span2">A preview. Confirmation is asked, and nothing is sent.</p>' : ""}
        ${preview ? "" : connectionsCard(model)}
        <section class="card">
          <p class="kicker">Plug and charge</p>
          <h2>One gesture</h2>
          <p id="plug-message">${esc(model.plug?.message || "Idle")}</p>
          <div class="stepper" id="steps"></div>
          <div class="row"><button class="primary" id="plug" type="button">Plug & charge</button><button id="plug-cancel" type="button">Cancel</button></div>
          <div class="row" style="margin-top:14px"><button id="start" type="button">Start charging</button><button class="danger" id="stop" type="button">Stop charging</button></div>
        </section>
        <section class="card">
          <p class="kicker">The house right now</p>
          ${lotusSvg(e.batterySoc)}
          <p class="muted">Car ${esc(data.vehicle?.batteryPercent ?? "—")}% · ${esc(data.vehicle?.chargingState || "unknown")}</p>
        </section>
        <section class="card span2">
          <p class="kicker">Limits</p>
          <label class="slider"><span>Tesla charge limit <b id="limit-label">${esc(settings.chargeLimit)}%</b></span><input id="limit" type="range" min="50" max="100" value="${esc(settings.chargeLimit)}"></label>
          <label class="slider"><span>Tesla charging amps <b id="amps-label">${esc(settings.amps)} A</b></span><input id="amps" type="range" min="5" max="32" value="${esc(settings.amps)}"></label>
          <label class="slider"><span>Home battery charge limit <b id="soc-label">${esc(settings.chargeSoc)}%</b></span><input id="soc" type="range" min="10" max="100" value="${esc(settings.chargeSoc)}"></label>
          <div class="row">
            <button data-apply="limit" type="button">Apply charge limit</button>
            <button data-apply="amps" type="button">Apply amps</button>
            <button data-apply="soc" type="button">Apply battery limit</button>
          </div>
          <p class="kicker" style="margin-top:18px">Charger and climate</p>
          <div class="row">
            <button data-mode="pv_surplus" type="button">Solar only</button>
            <button data-mode="fast" type="button">Fast</button>
            <button id="climate-on" type="button">Climate on</button>
            <button id="climate-off" type="button">Climate off</button>
          </div>
          <p class="error" id="err"></p>
        </section>
        <section class="card span2">
          <p class="kicker">Exact position · owner only</p>
          ${model.exact ? `<p class="exact">${esc(Number(model.exact.lat).toFixed(5))}, ${esc(Number(model.exact.lon).toFixed(5))}</p><p class="muted">${model.exact.sample ? "A sample point for this preview. The public pond only shows a 20 km wash." : "Live vehicle position. It is not on the public pond."}</p>` : "<p class='muted'>No position stored yet.</p>"}
        </section>
      </div>`;
      paintSteps(model.plug?.phase);
      wireSliders();
      wireCommands(preview);
    }

    function connectionsCard(model) {
      const tesla = Boolean(model.status?.tesla);
      const sigen = Boolean(model.status?.sigen);
      return `<section class="card span2">
          <p class="kicker">Connections</p>
          <h2>${tesla && sigen ? "Both shores are tied" : "Tie the shores"}</h2>
          <p>${tesla ? "Tesla is connected." : "Tesla is not connected."} ${sigen ? "Sigen is connected." : "Sigen is not connected."}</p>
          <div class="row">
            <button class="${tesla ? "" : "primary"}" id="tesla-start" type="button">${tesla ? "Reconnect Tesla" : "Connect Tesla"}</button>
            <button class="${sigen ? "" : "primary"}" id="sigen-start" type="button">${sigen ? "Reconnect Sigen" : "Connect Sigen"}</button>
          </div>
          <p class="error" id="conn-err"></p>
          <details><summary>Manual fallback</summary>
            <label class="field"><span>Paste the Tesla callback URL</span><textarea id="tesla-url" rows="3"></textarea></label>
            <button id="tesla-finish" type="button">Save Tesla connection</button>
            <p id="sigen-url"></p>
            <label class="field"><span>Sigen access token</span><input id="sigen-access" type="password" autocomplete="off"></label>
            <label class="field"><span>Sigen refresh token</span><input id="sigen-refresh" type="password" autocomplete="off"></label>
            <button id="sigen-import" type="button">Import Sigen tokens</button>
          </details>
        </section>`;
    }

    function paintSteps(phase) {
      const order = ["opening_port", "waiting_for_cable", "starting_charge", "charging"];
      const labels = ["Open port", "Wait for cable", "Start charger", "Charging"];
      const active = order.indexOf(phase);
      const steps = document.getElementById("steps");
      if (!steps) return;
      steps.innerHTML = labels.map((label, i) => `<b class="${i <= active ? "on" : ""}">${label}</b>`).join("");
    }

    function wireSliders() {
      for (const [id, label, suffix] of [["limit", "limit-label", "%"], ["amps", "amps-label", " A"], ["soc", "soc-label", "%"]]) {
        const input = document.getElementById(id);
        if (!input) continue;
        input.oninput = () => { document.getElementById(label).textContent = input.value + suffix; };
      }
    }

    async function post(path, body, title, detail, preview) {
      if (!(await ask(title, detail))) return null;
      if (preview) {
        const err = document.getElementById("err");
        if (err) err.textContent = "Nothing was sent.";
        return { mocked: true };
      }
      const session = await fetch("/api/session").then((r) => r.json());
      const response = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json", "x-csrf-token": session.csrfToken || "" },
        body: JSON.stringify({ ...body, confirm: true }),
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Command failed");
      return payload;
    }

    function wireCommands(preview) {
      const err = document.getElementById("err");
      const run = (fn) => fn().catch((error) => { if (err) err.textContent = error.message || "Command failed"; });
      document.getElementById("plug").onclick = () => run(async () => {
        const state = await post("/api/controls/plug-charge", {}, "Plug and charge", "Open the charge port, watch for the cable for up to 5 minutes, then start the charger.", preview);
        if (state && !state.mocked) { document.getElementById("plug-message").textContent = state.message; paintSteps(state.phase); watchPlug(); }
        if (state && state.mocked) { document.getElementById("plug-message").textContent = "The port would open, then the desk would wait for the cable."; paintSteps("waiting_for_cable"); }
      });
      document.getElementById("plug-cancel").onclick = () => run(() => post("/api/controls/plug-charge/cancel", {}, "Cancel plug and charge", "Stop waiting for the cable.", preview));
      document.getElementById("start").onclick = () => run(() => post("/api/controls/charge/start", {}, "Start charging", "Start the Sigen AC charger and send Tesla charge start.", preview));
      document.getElementById("stop").onclick = () => run(() => post("/api/controls/charge/stop", {}, "Stop charging", "Stop the Sigen AC charger and send Tesla charge stop.", preview));
      document.querySelector("[data-apply=limit]").onclick = () => run(() => post("/api/controls/tesla/charge-limit", { percent: Number(document.getElementById("limit").value) }, "Set charge limit", "Set the Tesla charge limit to " + document.getElementById("limit").value + "%.", preview));
      document.querySelector("[data-apply=amps]").onclick = () => run(() => post("/api/controls/tesla/amps", { amps: Number(document.getElementById("amps").value) }, "Set charging amps", "Set Tesla charging amps to " + document.getElementById("amps").value + ".", preview));
      document.querySelector("[data-apply=soc]").onclick = () => run(() => post("/api/controls/sigen/charge-soc", { chargeSoc: Number(document.getElementById("soc").value) }, "Set battery charge limit", "Change only chargeSOC. The other battery SOC values stay as they are.", preview));
      document.querySelector("[data-mode=pv_surplus]").onclick = () => run(() => post("/api/controls/sigen/charger-mode", { mode: "pv_surplus" }, "Solar-only charging", "Switch the AC charger to photovoltaic surplus.", preview));
      document.querySelector("[data-mode=fast]").onclick = () => run(() => post("/api/controls/sigen/charger-mode", { mode: "fast" }, "Fast charging", "Switch the AC charger to fast mode.", preview));
      document.getElementById("climate-on").onclick = () => run(() => post("/api/controls/climate", { on: true }, "Climate on", "Turn the cabin climate on.", preview));
      document.getElementById("climate-off").onclick = () => run(() => post("/api/controls/climate", { on: false }, "Climate off", "Turn the cabin climate off.", preview));
      if (!preview) wireOwner();
    }

    async function watchPlug() {
      for (let i = 0; i < 80; i++) {
        await new Promise((resolve) => setTimeout(resolve, 1000));
        const state = await fetch("/api/controls/plug-charge").then((r) => r.json());
        const message = document.getElementById("plug-message");
        if (!message) return;
        message.textContent = state.message || state.phase;
        paintSteps(state.phase);
        if (["charging", "timed_out", "failed", "cancelled", "idle"].includes(state.phase)) return;
      }
    }

    function wireOwner() {
      document.getElementById("tesla-start").onclick = async () => {
        if (!(await ask("Connect Tesla", "Tesla opens, you sign in if asked, and it comes straight back here connected."))) return;
        const session = await fetch("/api/session").then((r) => r.json());
        const response = await fetch("/api/owner/tesla/start", { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": session.csrfToken }, body: JSON.stringify({ confirm: true }) });
        const payload = await response.json();
        if (payload.url) { location.href = payload.url; return; }
        document.getElementById("conn-err").textContent = payload.error || "Could not start Tesla sign-in";
      };
      document.getElementById("tesla-finish").onclick = async () => {
        if (!(await ask("Save Tesla connection", "Exchange the pasted callback for this app's own refresh token."))) return;
        const session = await fetch("/api/session").then((r) => r.json());
        const response = await fetch("/api/owner/tesla/finish", { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": session.csrfToken }, body: JSON.stringify({ confirm: true, callbackUrl: document.getElementById("tesla-url").value }) });
        const payload = await response.json();
        document.getElementById("conn-err").textContent = response.ok ? "Tesla connected as " + (payload.name || "the car") + "." : (payload.error || "Tesla connection failed");
      };
      document.getElementById("sigen-start").onclick = async () => {
        if (!(await ask("Connect Sigen", "Sigen opens. Click Authorize and continue, and it comes back here connected."))) return;
        const session = await fetch("/api/session").then((r) => r.json());
        const response = await fetch("/api/owner/sigen/start", { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": session.csrfToken }, body: JSON.stringify({ confirm: true }) });
        const payload = await response.json();
        if (payload.url) { location.href = payload.url; return; }
        document.getElementById("conn-err").textContent = payload.error || "Could not start Sigen sign-in";
      };
      document.getElementById("sigen-import").onclick = async () => {
        if (!(await ask("Import Sigen tokens", "Store the access and refresh tokens for this house. They stay in the token vault."))) return;
        const session = await fetch("/api/session").then((r) => r.json());
        const response = await fetch("/api/owner/sigen/import", { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": session.csrfToken }, body: JSON.stringify({ confirm: true, accessToken: document.getElementById("sigen-access").value, refreshToken: document.getElementById("sigen-refresh").value, expiresIn: 3600 }) });
        const payload = await response.json();
        document.getElementById("conn-err").textContent = response.ok ? "Sigen tokens stored." : (payload.error || "Import failed");
      };
    }

    async function showControls() {
      const session = await fetch("/api/session").then((r) => r.json());
      if (!session.authenticated) { location.href = "/login"; return; }
      let state = {};
      try { state = await fetch("/api/controls/state").then((r) => r.json()); } catch { state = {}; }
      state.status = state.status || (await fetch("/api/owner/status").then((r) => r.ok ? r.json() : {}).catch(() => ({})));
      const map = await fetch("/api/controls/map").catch(() => ({ ok: false }));
      state.exact = map.ok ? await map.json() : null;
      try {
        controlDesk(state, false);
      } catch (error) {
        app.innerHTML = `<div class="board controls">${connectionsCard(state)}</div>`;
        wireOwner();
      }
      if (state.plug && ["opening_port", "waiting_for_cable", "starting_charge"].includes(state.plug.phase)) watchPlug();
    }

    if (page === "public") showPublic();
    if (page === "login") showLogin();
    if (page === "controls") showControls();
    if (page === "preview") controlDesk(boot, true);
  </script>
</body>
</html>
