<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>White Lotus</title>
  <style>__FONT_CSS__</style>
  <style>
    :root {
      --wash: #090e0c;
      --pond: #121916;
      --sheet: rgba(236, 230, 216, 0.055);
      --ink: #f3f6f1;
      --muted: #b7c2b8;
      --line: rgba(212, 184, 140, 0.32);
      --gold: #f0e2c4;
      --gold-deep: #c4a46a;
      --jade: #8fbfa8;
      --water: #7ea8b0;
      --blossom: #f0c9c2;
      --danger: #e0a090;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Lotus Sans", "Avenir Next", system-ui, sans-serif;
      font-weight: 400;
      background:
        radial-gradient(1100px 560px at 82% -12%, rgba(228, 196, 140, 0.2), transparent 56%),
        radial-gradient(820px 620px at -8% 18%, rgba(64, 104, 96, 0.28), transparent 54%),
        radial-gradient(900px 520px at 50% 120%, rgba(16, 36, 42, 0.55), transparent 60%),
        var(--wash);
    }
    .atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .grain, .fibers {
      position: absolute;
      inset: -2%;
    }
    .grain {
      opacity: 0.55;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='matrix' values='1 0 0 0 0.25  0 1 0 0 0.2  0 0 1 0 0.12  0 0 0 0.7 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .fibers {
      opacity: 0.28;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='f'><feTurbulence type='turbulence' baseFrequency='0.02 0.25' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='1 0 0 0 0.4  0 1 0 0 0.32  0 0 1 0 0.2  0 0 0 0.45 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
    }
    .ripples { position: absolute; right: -30px; bottom: 6%; width: 340px; height: 150px; }
    .ripples i {
      position: absolute;
      inset: 10%;
      border: 1px solid rgba(228, 210, 176, 0.28);
      border-radius: 50%;
      animation: pond 9s ease-in-out infinite;
    }
    .ripples i:nth-child(2) { inset: 0; animation-delay: 1.6s; }
    .ripples i:nth-child(3) { inset: 22%; animation-delay: 3.1s; }
    .petal { position: absolute; width: 28px; height: 42px; opacity: 0.7; animation: drift-petal 22s ease-in-out infinite; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25)); }
    .petal.p1 { top: 14%; left: 12%; animation-duration: 24s; }
    .petal.p2 { top: 28%; left: 78%; width: 22px; animation-duration: 19s; animation-delay: -6s; }
    .petal.p3 { top: 62%; left: 8%; animation-duration: 27s; animation-delay: -11s; }
    .petal.p4 { top: 74%; left: 86%; width: 18px; animation-duration: 21s; animation-delay: -3s; }
    .petal.p5 { top: 46%; left: 46%; width: 16px; opacity: 0.35; animation-duration: 30s; animation-delay: -14s; }
    @keyframes drift-petal {
      0% { transform: translate3d(0, 0, 0) rotate(-8deg); }
      50% { transform: translate3d(16px, 28px, 0) rotate(14deg); }
      100% { transform: translate3d(-10px, 64px, 0) rotate(-4deg); }
    }
    @keyframes pond {
      0%, 100% { transform: scale(0.86); opacity: 0.2; }
      50% { transform: scale(1.12); opacity: 0.55; }
    }
    .rail {
      display: none;
      position: fixed;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 28px;
      width: 28px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      pointer-events: none;
    }
    .rail span {
      font-family: "Lotus Seal", "Lotus Serif", serif;
      font-size: 1.55rem;
      color: var(--gold);
      line-height: 1;
    }
    .rail b {
      display: block;
      width: 1px;
      height: 88px;
      background: linear-gradient(var(--gold-deep), transparent);
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .skip {
      position: absolute;
      left: 12px;
      top: -40px;
      background: var(--gold);
      color: #1a140c;
      padding: 8px 12px;
      z-index: 5;
    }
    .skip:focus { top: 12px; }
    header, main { position: relative; z-index: 1; width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; padding: 42px 0 6px; gap: 18px; }
    .brand { display: flex; gap: 16px; align-items: center; text-decoration: none; }
    .brand svg.mark { width: 46px; height: 46px; flex: none; }
    .brand strong { display: block; font-family: "Lotus Serif", Georgia, serif; font-weight: 500; font-size: 2rem; letter-spacing: -0.02em; line-height: 0.95; }
    .brand .eyebrow, .kicker {
      color: var(--gold);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }
    .stamp {
      font-family: "Lotus Seal", "Lotus Serif", serif;
      writing-mode: vertical-rl;
      color: var(--gold);
      font-size: 0.95rem;
      letter-spacing: 0.28em;
      line-height: 1;
      padding: 4px 0 4px 10px;
      border-left: 1px solid rgba(228, 210, 176, 0.45);
    }
    nav a { color: var(--muted); text-decoration: none; letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.72rem; border-bottom: 1px solid transparent; padding-bottom: 3px; }
    nav a:hover { color: var(--gold); border-color: var(--gold-deep); }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 22px 0 96px; }
    .span2 { grid-column: span 2; }
    .card, .sheet {
      position: relative;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255, 248, 236, 0.07), transparent 46%),
        linear-gradient(180deg, rgba(236, 230, 216, 0.07), rgba(8, 12, 10, 0.18));
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 30px 30px 26px;
      box-shadow:
        0 30px 60px -36px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 248, 236, 0.08),
        inset 0 0 70px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      left: 28px;
      right: 28px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(240, 226, 196, 0.75), transparent);
      pointer-events: none;
    }
    h1, h2, .num, .exact {
      font-family: "Lotus Serif", Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    h1 { font-size: clamp(3rem, 6.4vw, 5rem); line-height: 0.9; margin: 0; }
    h1 em { font-style: italic; color: var(--gold); font-weight: 500; }
    h2 { font-size: 2rem; line-height: 1.05; margin: 0 0 16px; }
    .lede { max-width: 38rem; margin: 16px 0 0; color: var(--muted); font-size: 1.05rem; }
    .num { font-size: clamp(4.2rem, 8vw, 6.4rem); line-height: 0.86; margin: 18px 0 0; }
    .num em { font-style: italic; color: var(--gold); font-size: 0.34em; margin-left: 10px; letter-spacing: 0; }
    p { line-height: 1.6; }
    .muted { color: var(--muted); }
    .kicker { margin: 0 0 12px; }
    .figure-row, .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 28px; }
    .figure { border-top: 1px solid var(--line); padding-top: 12px; }
    .figure b { display: block; font-family: "Lotus Serif", Georgia, serif; font-size: 1.85rem; font-weight: 500; letter-spacing: -0.03em; }
    .figure span { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(180px, 280px); gap: 8px 12px; align-items: end; }
    .hero-wash { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .hero-copy, .hero-lotus { position: relative; z-index: 1; }
    .hero-lotus { width: min(100%, 280px); margin-left: auto; }
    svg.viz { width: 100%; height: auto; display: block; }
    svg.flow path { fill: none; }
    svg.flow path.stream { stroke-linecap: round; animation: drift 7s linear infinite; }
    @keyframes drift { to { stroke-dashoffset: -114; } }
    .lotus-wrap { max-width: 280px; margin: 4px auto 0; }
    .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; margin-top: 8px; }
    .dow { text-align: center; color: var(--muted); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .cell {
      aspect-ratio: 1;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      color: var(--cell, #f3f6f1);
      background: color-mix(in srgb, #9dcfb6 calc(var(--self, 0) * 100%), #17211d);
      box-shadow: inset 0 0 0 1px rgba(255, 248, 236, 0.06);
    }
    .cell.empty { background: transparent; box-shadow: none; }
    .legend { display: flex; align-items: center; gap: 6px; margin-top: 14px; color: var(--muted); font-size: 0.75rem; }
    .legend i { width: 14px; height: 14px; border-radius: 4px; display: block; background: color-mix(in srgb, #9dcfb6 calc(var(--self, 0) * 100%), #17211d); }
    .session { display: grid; grid-template-columns: 7.2rem 1fr auto; gap: 12px; align-items: center; margin: 12px 0; font-size: 0.88rem; }
    .track { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.05); overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px rgba(228,210,176,0.12); }
    .track i { display: block; height: 100%; }
    .track .sun { background: linear-gradient(90deg, #f0e2c4, #c4a46a); }
    .track .grid { background: linear-gradient(90deg, #9ec4c8, #6f95a4); }
    .desk-title { padding: 6px 8px 0; }
    .desk-title h1 { font-size: clamp(2.4rem, 4vw, 3.4rem); }
    .login-lotus { width: min(168px, 46%); margin: 0 auto 8px; }
    button, summary { font: inherit; color: var(--ink); }
    button, .btn {
      min-height: 44px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 16px;
      cursor: pointer;
    }
    button.primary { background: var(--gold); color: #1c160e; border-color: transparent; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.45; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    label.slider, label.field { display: block; margin: 14px 0; }
    label.slider span, label.field span { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; }
    input[type="range"] { width: 100%; accent-color: #c4a46a; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; margin-top: 6px; background: #0d1210; color: var(--ink);
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit;
    }
    .stepper { display: flex; gap: 8px; margin: 14px 0 16px; }
    .stepper b { flex: 1; border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); font-weight: 400; font-size: 0.75rem; }
    .stepper b.on { border-color: var(--gold-deep); color: var(--gold); }
    .exact { font-family: "Lotus Serif", Georgia, serif; font-size: 1.8rem; margin: 8px 0; }
    .banner { background: var(--gold); color: #1c160e; border-radius: 16px; padding: 12px 14px; }
    dialog { border: 1px solid var(--line); background: #17201c; color: var(--ink); border-radius: 22px; padding: 22px; width: min(420px, calc(100% - 32px)); }
    dialog::backdrop { background: rgba(0,0,0,0.6); }
    dialog p { color: var(--muted); }
    .error { color: var(--danger); min-height: 1.2em; }
    .stage { min-height: calc(100vh - 120px); display: grid; place-items: center; padding: 24px 0 64px; }
    .login { width: min(440px, 100%); }
    .login h1 { font-size: 2.6rem; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 12px; }
    @media (min-width: 1240px) {
      .rail { display: flex; }
      header, main { width: min(1120px, calc(100% - 140px)); }
    }
    @media (max-width: 800px) {
      header, main { width: min(100% - 36px, 1120px); }
      header { flex-direction: column; align-items: flex-start; padding: 28px 0 4px; gap: 14px; }
      .brand strong { font-size: 1.65rem; }
      .stamp { font-size: 0.85rem; }
      .board { grid-template-columns: 1fr; gap: 16px; padding: 16px 0 72px; }
      .span2 { grid-column: auto; }
      .card { padding: 22px 18px 18px; border-radius: 24px; }
      .hero-grid { grid-template-columns: 1fr; }
      .hero-lotus { width: min(210px, 68%); margin: 0 auto 4px; order: -1; }
      h1 { font-size: 2.55rem; }
      h2 { font-size: 1.65rem; margin-bottom: 12px; }
      .lede { font-size: 0.98rem; margin-top: 12px; }
      .num { font-size: 3.35rem; margin-top: 12px; }
      .figure-row, .stats { grid-template-columns: 1fr 1fr; gap: 16px 12px; margin-top: 20px; }
      .figure b { font-size: 1.45rem; }
      .cal { gap: 5px; }
      .cell { font-size: 0.62rem; border-radius: 7px; }
      .session { grid-template-columns: 5.4rem minmax(0, 1fr) auto; gap: 8px; }
      .ripples { display: none; }
      .petal.p3, .petal.p5 { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body data-page="__PAGE__">
  <a class="skip" href="#app">Skip to content</a>
  <div class="atmosphere" aria-hidden="true">
    <div class="grain"></div>
    <div class="fibers"></div>
    <div class="ripples"><i></i><i></i><i></i></div>
    <svg class="petal p1" viewBox="0 0 48 72"><path d="M24 70 C 8 48, 6 22, 24 2 C 42 22, 40 48, 24 70 Z" fill="#f0c9c2"/></svg>
    <svg class="petal p2" viewBox="0 0 48 72"><path d="M24 70 C 10 46, 8 20, 24 4 C 40 20, 38 46, 24 70 Z" fill="#f7f1e4"/></svg>
    <svg class="petal p3" viewBox="0 0 48 72"><path d="M24 68 C 12 46, 10 24, 24 6 C 38 24, 36 46, 24 68 Z" fill="#e7b7b0"/></svg>
    <svg class="petal p4" viewBox="0 0 48 72"><path d="M24 70 C 9 48, 8 22, 24 3 C 40 22, 39 48, 24 70 Z" fill="#f3e6c8"/></svg>
    <svg class="petal p5" viewBox="0 0 48 72"><path d="M24 66 C 14 46, 12 26, 24 8 C 36 26, 34 46, 24 66 Z" fill="#f7f1e4"/></svg>
  </div>
  <aside class="rail" aria-hidden="true"><span>白</span><b></b><span>蓮</span></aside>
  <header>
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#c4a46a" stroke-width="1"/>
        <path d="M32 12c7 9 8 16 0 22-8-6-7-13 0-22z" fill="url(#markGold)" stroke="#f0e2c4" stroke-width="0.6"/>
        <path d="M32 30c10 4 16 10 16 16-10-2-14-7-16-16z" fill="#8fbfa8" opacity="0.85"/>
        <path d="M32 30c-10 4-16 10-16 16 10-2 14-7 16-16z" fill="#6ea48c"/>
        <defs>
          <linearGradient id="markGold" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#a8843e"/><stop offset="0.5" stop-color="#f3e6c8"/><stop offset="1" stop-color="#c4a46a"/>
          </linearGradient>
        </defs>
      </svg>
      <div><span class="eyebrow">Moonlit pond</span><strong>White Lotus</strong></div>
      <span class="stamp">白蓮</span>
    </a>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <dialog id="confirm">
    <h2 id="confirm-title"></h2>
    <p id="confirm-detail"></p>
    <div class="row"><button type="button" id="confirm-no">Cancel</button><button type="button" class="primary" id="confirm-yes">Send command</button></div>
  </dialog>
  <script type="application/json" id="boot">__BOOT_JSON__</script>
  <script nonce="__NONCE__">
    const page = document.body.dataset.page;
    const boot = JSON.parse(document.getElementById("boot").textContent || "null");
    const app = document.getElementById("app");
    const nav = document.getElementById("nav");
    nav.innerHTML = page === "public" || page === "login" ? '<a href="/login">Owner</a>' : '<a href="/">The pond</a>';

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function kw(watts) { return (Number(watts || 0) / 1000).toFixed(1); }
    function money(value, currency) {
      try { return new Intl.NumberFormat("en-AU", { style: "currency", currency: currency || "AUD" }).format(value || 0); }
      catch { return "$" + Number(value || 0).toFixed(2); }
    }
    function hourIn(ts, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: timeZone || "Australia/Sydney", hour: "2-digit", hourCycle: "h23" }).formatToParts(new Date(ts));
      const hour = Number(parts.find((part) => part.type === "hour")?.value || 0);
      return hour === 24 ? 0 : hour;
    }
    function ask(title, detail) {
      const dialog = document.getElementById("confirm");
      document.getElementById("confirm-title").textContent = title;
      document.getElementById("confirm-detail").textContent = detail;
      dialog.showModal();
      return new Promise((resolve) => {
        const yes = document.getElementById("confirm-yes");
        const no = document.getElementById("confirm-no");
        const finish = (value) => { yes.onclick = null; no.onclick = null; dialog.close(); resolve(value); };
        yes.onclick = () => finish(true);
        no.onclick = () => finish(false);
      });
    }

    const PETAL = "M0,12 C-18,2 -24,-36 -8,-78 C-2,-90 2,-90 8,-78 C24,-36 18,2 0,12 Z";

    function cubic(p0, p1, p2, p3, t) {
      const u = 1 - t;
      return [
        u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
        u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
      ];
    }

    function brush(x1, y1, x2, y2, bow, watts, color) {
      const c1 = [x1 + (x2 - x1) * 0.34, y1 + bow];
      const c2 = [x1 + (x2 - x1) * 0.66, y2 + bow * 0.35];
      const p0 = [x1, y1];
      const p3 = [x2, y2];
      const width = 0.7 + Math.min(8.5, Math.abs(Number(watts) || 0) / 1000 * 1.25);
      const steps = 28;
      let body = "";
      for (let i = 0; i < steps; i++) {
        const t0 = i / steps;
        const t1 = (i + 1) / steps;
        const a = cubic(p0, c1, c2, p3, t0);
        const b = cubic(p0, c1, c2, p3, t1);
        const taper = Math.sin(Math.PI * ((t0 + t1) / 2)) ** 0.8;
        const w = (0.35 + width * taper).toFixed(2);
        body += `<path fill="none" stroke="${color}" stroke-linecap="round" stroke-width="${w}" opacity="${(0.22 + 0.78 * taper).toFixed(2)}" d="M${a[0].toFixed(1)} ${a[1].toFixed(1)} L${b[0].toFixed(1)} ${b[1].toFixed(1)}"/>`;
      }
      const d = `M${x1} ${y1} C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${x2} ${y2}`;
      const glow = `<path fill="none" stroke="${color}" stroke-width="${(width * 0.55 + 3.2).toFixed(2)}" stroke-linecap="round" opacity="0.38" filter="url(#flowGlow)" d="${d}"/>`;
      const stream = `<path class="stream" fill="none" stroke="${color}" stroke-width="1.15" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.9" d="${d}"/>`;
      return glow + body + stream;
    }

    function flowSvg(energy, vehicle) {
      const e = energy || {};
      const carW = e.chargerW || (vehicle && vehicle.chargingState === "Charging" ? 3000 : 180);
      const nodes = [
        ["Sun", kw(e.solarW), 78, 72],
        ["House", kw(e.homeW), 286, 78],
        ["Car", vehicle && vehicle.batteryPercent != null ? Math.round(vehicle.batteryPercent) + "%" : "—", 492, 70],
        ["Battery", e.batterySoc == null ? "—" : Math.round(e.batterySoc) + "%", 176, 196],
        ["Grid", kw(Math.abs(e.gridW || 0)), 392, 198],
      ];
      const strokes = [
        brush(78, 72, 286, 78, -48, e.solarW, "#f0e2c4"),
        brush(286, 96, 176, 178, 36, Math.abs(e.batteryW || 0), "#8fbfa8"),
        brush(286, 96, 392, 180, -28, Math.abs(e.gridW || 0), "#8eb8c0"),
        brush(310, 70, 468, 70, -34, carW, "#f0c9c2"),
      ].join("");
      const labels = nodes.map(([name, value, x, y]) =>
        `<g>
          <circle cx="${x}" cy="${y}" r="34" fill="#101614" stroke="#c4a46a" stroke-width="1"/>
          <circle cx="${x}" cy="${y}" r="27" fill="none" stroke="rgba(240,226,196,0.28)" stroke-width="0.6"/>
          <text x="${x}" y="${y - 1}" text-anchor="middle" fill="#f3f6f1" font-size="13" font-family="Lotus Serif, Georgia, serif">${esc(value)}</text>

      const here = koiAt(center);

      const angle = Math.atan2(ahead[1] - here[1], ahead[0] - here[0]) * 180 / Math.PI;
      return `<svg class="viz" viewBox="0 0 560 190" role="img" aria-label="A koi at ${percent == null ? "an unknown" : Math.round(percent)} percent charge, after ${esc(km)} kilometres this week">
        <path d="M36 150 C 120 156, 150 62, 230 96 C 320 132, 390 46, 520 86" fill="none" stroke="rgba(142,184,192,0.55)" stroke-width="1.2"/>
        <path d="M48 162 C 140 168, 180 92, 250 112 C 340 138, 400 70, 530 102" fill="none" stroke="rgba(240,226,196,0.18)" stroke-width="0.8"/>
        <g data-koi data-a="${a.toFixed(3)}" data-b="${b.toFixed(3)}" transform="translate(${here[0].toFixed(1)} ${here[1].toFixed(1)}) rotate(${angle.toFixed(1)}) scale(1.7)">${koiBody()}</g>
      </svg>
      <p class="muted">${percent == null ? "The car has not reported a charge." : Math.round(percent) + "% full."} ${esc(km)} km on the week.</p>`;
    }

    function mountKoi() {
      const fish = document.querySelector("[data-koi]");
      if (!fish || fish.dataset.bound) return;
      fish.dataset.bound = "1";
      const from = Number(fish.dataset.a);
      const to = Number(fish.dataset.b);
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const started = performance.now();
      const frame = (now) => {
        if (!fish.isConnected) return;
        const wave = (Math.sin(((now - started) / 7000) * Math.PI) + 1) / 2;
        const t = from + (to - from) * wave;
        const point = koiAt(t);
        const next = koiAt(Math.min(0.98, t + 0.035));
        const angle = Math.atan2(next[1] - point[1], next[0] - point[0]) * 180 / Math.PI;
        fish.setAttribute("transform", `translate(${point[0].toFixed(1)} ${point[1].toFixed(1)}) rotate(${angle.toFixed(1)}) scale(1.7)`);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }

      const status = await fetch("/api/auth/status").then((r) => r.json()).catch(() => ({ passkeys: 0 }));
      const register = status.passkeys === 0;
      app.innerHTML = `<div class="stage"><section class="card login">

        <button class="primary" id="go" type="button">${register ? "Create passkey" : "Use passkey"}</button>
      </section></div>`;
      document.getElementById("go").onclick = async () => {
        const err = document.getElementById("err");
        err.textContent = "";
        try {
          const setupCode = document.getElementById("setup")?.value || "";
          const kind = register ? "register" : "login";
          const start = await fetch(`/api/auth/${kind}/options`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(register ? { setupCode } : {}) });
          const started = await start.json();
          if (!start.ok) throw new Error(started.error || "Could not start");
          const publicKey = register
            ? PublicKeyCredential.parseCreationOptionsFromJSON(started.options)
            : PublicKeyCredential.parseRequestOptionsFromJSON(started.options);
          const credential = register
            ? await navigator.credentials.create({ publicKey })
            : await navigator.credentials.get({ publicKey });
          const done = await fetch(`/api/auth/${kind}/verify`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ challengeId: started.challengeId, credential: credential.toJSON(), setupCode }) });
          const result = await done.json();
          if (!done.ok) throw new Error(result.error || "Passkey was not accepted");
          location.href = "/controls";
        } catch (error) {
          err.textContent = error.message || "Passkey failed";
        }
      };
    }

    function paintSteps(phase) {

      const steps = document.getElementById("steps");
      if (!steps) return;
      steps.innerHTML = labels.map((label, i) => `<b class="${i <= active ? "on" : ""}">${label}</b>`).join("");
    }

    function wireSliders() {
      for (const [id, label, suffix] of [["limit", "limit-label", "%"], ["amps", "amps-label", " A"], ["soc", "soc-label", "%"]]) {

        if (!input) continue;
        input.oninput = () => { document.getElementById(label).textContent = input.value + suffix; };

    async function post(path, body, title, detail, preview) {
      if (!(await ask(title, detail))) return null;
      if (preview) {
        const err = document.getElementById("err");
        if (err) err.textContent = "Nothing was sent.";
        return { mocked: true };
      }
      const session = await fetch("/api/session").then((r) => r.json());
      const response = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json", "x-csrf-token": session.csrfToken || "" },
        body: JSON.stringify({ ...body, confirm: true }),
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Command failed");
      return payload;
    }

    function wireCommands(preview) {
      const err = document.getElementById("err");
      const run = (fn) => fn().catch((error) => { if (err) err.textContent = error.message || "Command failed"; });
      document.getElementById("plug").onclick = () => run(async () => {
        const state = await post("/api/controls/plug-charge", {}, "Plug and charge", "Open the charge port, watch for the cable for up to 5 minutes, then start the charger.", preview);
        if (state && !state.mocked) { document.getElementById("plug-message").textContent = state.message; paintSteps(state.phase); watchPlug(); }
        if (state && state.mocked) { document.getElementById("plug-message").textContent = "The port would open, then the desk would wait for the cable."; paintSteps("waiting_for_cable"); }
      });
      document.getElementById("plug-cancel").onclick = () => run(() => post("/api/controls/plug-charge/cancel", {}, "Cancel plug and charge", "Stop waiting for the cable.", preview));
      document.getElementById("start").onclick = () => run(() => post("/api/controls/charge/start", {}, "Start charging", "Start the Sigen AC charger and send Tesla charge start.", preview));
      document.getElementById("stop").onclick = () => run(() => post("/api/controls/charge/stop", {}, "Stop charging", "Stop the Sigen AC charger and send Tesla charge stop.", preview));
      document.querySelector("[data-apply=limit]").onclick = () => run(() => post("/api/controls/tesla/charge-limit", { percent: Number(document.getElementById("limit").value) }, "Set charge limit", "Set the Tesla charge limit to " + document.getElementById("limit").value + "%.", preview));
      document.querySelector("[data-apply=amps]").onclick = () => run(() => post("/api/controls/tesla/amps", { amps: Number(document.getElementById("amps").value) }, "Set charging amps", "Set Tesla charging amps to " + document.getElementById("amps").value + ".", preview));
      document.querySelector("[data-apply=soc]").onclick = () => run(() => post("/api/controls/sigen/charge-soc", { chargeSoc: Number(document.getElementById("soc").value) }, "Set battery charge limit", "Change only chargeSOC. The other battery SOC values stay as they are.", preview));
      document.querySelector("[data-mode=pv_surplus]").onclick = () => run(() => post("/api/controls/sigen/charger-mode", { mode: "pv_surplus" }, "Solar-only charging", "Switch the AC charger to photovoltaic surplus.", preview));

    async function watchPlug() {
      for (let i = 0; i < 80; i++) {

        if (!message) return;
        message.textContent = state.message || state.phase;
        paintSteps(state.phase);
        if (["charging", "timed_out", "failed", "cancelled", "idle"].includes(state.phase)) return;

        controlDesk(state, false);
      } catch (error) {
        app.innerHTML = `<div class="board controls">${connectionsCard(state)}</div>`;
        wireOwner();
      }
      if (state.plug && ["opening_port", "waiting_for_cable", "starting_charge"].includes(state.plug.phase)) watchPlug();
    }

    if (page === "public") showPublic();
    if (page === "login") showLogin();
    if (page === "controls") showControls();
    if (page === "preview") controlDesk(boot, true);
  </script>
</body>
</html>
